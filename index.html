<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Райони Львова — де шукати житло</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #app { display: flex; flex-direction: column; height: 100%; overflow-x: hidden; }
    #topbar {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 10px 12px; background: #1f2937; color: #fff;
    }
    #topbar h1 { font-size: 15px; margin: 0 8px 0 0; white-space: nowrap; }
    #searchForm { display: flex; gap: 6px; flex: 1 1 260px; min-width: 0; }
    #searchBox { position: relative; flex: 1; min-width: 0; }
    #searchInput {
      width: 100%; padding: 8px 10px; border: none; border-radius: 8px; font-size: 14px;
    }
    #suggestions {
      display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      z-index: 2000; background: #fff; border-radius: 8px; overflow: hidden auto;
      max-height: 45vh; box-shadow: 0 4px 16px rgba(0,0,0,.35);
    }
    #suggestions button {
      display: block; width: 100%; text-align: left; background: #fff; color: #1f2937;
      border: 0; border-bottom: 1px solid #f3f4f6; border-radius: 0; padding: 9px 10px;
      white-space: normal; word-break: break-word; line-height: 1.35;
    }
    #suggestions button:last-child { border-bottom: 0; }
    #suggestions button.hl, #suggestions button:hover { background: #eff6ff; filter: none; }
    #suggestions .sub { color: #6b7280; font-size: 12px; }
    button {
      padding: 8px 12px; border: none; border-radius: 8px; font-size: 14px;
      background: #3b82f6; color: #fff; cursor: pointer;
    }
    #topbar > button, #searchForm > button { white-space: nowrap; }
    button:hover { filter: brightness(1.1); }
    button.secondary { background: #4b5563; }
    button.active { background: #d97706; }
    #resultBar {
      display: none; padding: 8px 12px; font-size: 14px; line-height: 1.4;
      background: #f3f4f6; color: #111827; border-bottom: 1px solid #e5e7eb;
    }
    #resultBar.good { background: #dcfce7; }
    #resultBar.avoid { background: #fee2e2; }
    #resultBar .picklist button {
      display: block; width: 100%; text-align: left; margin-top: 6px;
      background: #fff; color: #1f2937; border: 1px solid #d1d5db;
      white-space: normal; word-break: break-word;
    }
    #map { flex: 1; }
    .legend {
      background: #fff; padding: 8px 12px; border-radius: 8px;
      box-shadow: 0 1px 5px rgba(0,0,0,.3); font-size: 13px; line-height: 1.7;
    }
    .legend .swatch {
      display: inline-block; width: 14px; height: 14px; border-radius: 3px;
      margin-right: 6px; vertical-align: -2px;
    }
    .zone-popup b { font-size: 14px; }
    .zone-popup .badge {
      display: inline-block; margin: 4px 0; padding: 2px 8px; border-radius: 999px;
      font-size: 12px; font-weight: 600;
    }
    .zone-popup .badge.good { background: #dcfce7; color: #166534; }
    .zone-popup .badge.avoid { background: #fee2e2; color: #991b1b; }
    .zone-popup p { margin: 6px 0 0; font-size: 13px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <h1>🗺️ Райони Львова</h1>
      <form id="searchForm">
        <div id="searchBox">
          <input id="searchInput" type="search" placeholder="Введіть вулицю або адресу…" autocomplete="off">
          <div id="suggestions"></div>
        </div>
        <button type="submit">Перевірити</button>
      </form>
      <button id="editBtn" class="secondary" type="button" hidden>✏️ Редагувати</button>
      <button id="exportBtn" class="secondary" type="button" hidden>💾 Зберегти data.js</button>
    </div>
    <div id="resultBar"></div>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.min.js"></script>
  <!-- ?v= — щоб браузер не показував стару закешовану версію. Міняйте число при кожному оновленні. -->
  <script src="data.js?v=6"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
